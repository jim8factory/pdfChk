<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>試験PDF判定エンジン（仕様準拠版）</title>
<style>
body { font-family: sans-serif; padding: 20px; }
pre { background: #f0f0f0; padding: 10px; }
</style>
</head>
<body>

<h2>試験PDF 判定（仕様準拠版）</h2>

<input type="file" id="pdf1">
<input type="file" id="pdf2">
<button id="run">判定する</button>

<pre id="out"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
async function extractText(file) {
    const data = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    let text = "";

    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(it => it.str).join(" ") + " ";
    }

    return text.replace(/\s+/g, " ");
}

function extractNumbers(text) {
    const reg = /A-\d+|B-\d+|問\d+/g;
    return text.match(reg) || [];
}

function isAnswerPDF(text) {
    // 仕様：答えPDFは「数字だけの行」が多い
    const lines = text.split(" ");
    let pureNumberLines = 0;

    for (const l of lines) {
        if (/^[1-5]$/.test(l)) pureNumberLines++;
    }

    return pureNumberLines >= 5; // 仕様：最低5行以上あれば答えPDFと判定
}

function judge(problemPDF, answerPDF, correctAnswers) {

    // ① 問題PDFであること
    if (!problemPDF.isProblem) {
        return "採点不可：PDF1は問題PDFではありません";
    }

    // ② 答えPDFであること
    if (!answerPDF.isAnswer) {
        return "採点不可：PDF2は答えPDFではありません";
    }

    // ③ 正答データが存在すること
    if (!correctAnswers || Object.keys(correctAnswers).length === 0) {
        return "採点不可：正答データがありません";
    }

    // ④ 番号一致チェック
    if (problemPDF.nums.length !== answerPDF.nums.length) {
        return "採点不可：問題番号と答え番号の数が一致しません";
    }

    for (let i = 0; i < problemPDF.nums.length; i++) {
        if (problemPDF.nums[i] !== answerPDF.nums[i]) {
            return "採点不可：問題番号と答え番号が一致しません";
        }
    }

    return "採点可能：問題PDFと答えPDFの組み合わせが正しい";
}

document.getElementById("run").onclick = async () => {
    const f1 = document.getElementById("pdf1").files[0];
    const f2 = document.getElementById("pdf2").files[0];

    if (!f1 || !f2) {
        document.getElementById("out").textContent = "PDFを2つ選択してください";
        return;
    }

    const t1 = await extractText(f1);
    const t2 = await extractText(f2);

    const nums1 = extractNumbers(t1);
    const nums2 = extractNumbers(t2);

    const pdf1info = {
        nums: nums1,
        isAnswer: isAnswerPDF(t1),
        isProblem: !isAnswerPDF(t1)
    };

    const pdf2info = {
        nums: nums2,
        isAnswer: isAnswerPDF(t2),
        isProblem: !isAnswerPDF(t2)
    };

    // 正答データ（仕様：ここに JSON を入れる）
    const correctAnswers = {}; // 今は空 → 採点不可になる（仕様どおり）

    const result = judge(pdf1info, pdf2info, correctAnswers);

    document.getElementById("out").textContent =
        `PDF1: ${f1.name}\nPDF2: ${f2.name}\n\n` +
        `問題番号(PDF1): ${nums1.join(", ")}\n` +
        `問題番号(PDF2): ${nums2.join(", ")}\n\n` +
        `PDF1は答えPDFか？: ${pdf1info.isAnswer}\n` +
        `PDF2は答えPDFか？: ${pdf2info.isAnswer}\n\n` +
        `判定結果: ${result}`;
};
</script>

</body>
</html>

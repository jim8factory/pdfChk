<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 問題・解答 対応チェック</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f6f8;color:#222}
header{background:#20242b;color:#fff;padding:18px 22px}
h1{font-size:20px;margin:0 0 5px}.sub{font-size:13px;opacity:.8}
main{max-width:1000px;margin:auto;padding:18px}
.panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label.file{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid #bbb;border-radius:8px;background:#fafafa;cursor:pointer;font-weight:600}
input[type=file]{display:none}
button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#555}button:disabled{opacity:.45;cursor:not-allowed}
.files{margin-top:12px;font-size:14px}.fileitem{padding:9px 0;border-bottom:1px solid #eee}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:12px;font-weight:700;margin-left:7px}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.ng{background:#fee2e2;color:#991b1b}.info{background:#e0e7ff;color:#3730a3}
.status{padding:12px;border-radius:8px;background:#f1f5f9;margin-top:12px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f8fafc}
#report{display:none}.small{font-size:12px;color:#666}
</style>
</head>
<body>
<header><h1>PDF 問題・解答 対応チェック</h1><div class="sub">版・タイトル・試験種別・問題番号・解答番号を軽量チェックし、異常点を報告します。</div></header>
<main>
<section class="panel">
  <div class="row">
    <label class="file">問題PDFを選択<input id="q" type="file" accept=".pdf"></label>
    <label class="file">解答PDFを選択<input id="a" type="file" accept=".pdf"></label>
    <button id="check" disabled>チェック開始</button>
    <button id="reset" class="secondary">リセット</button>
  </div>
  <div id="files" class="files">PDFを2つ選択してください。</div>
  <div class="small">※ 日本語・全角英数字・Unicodeの違いを正規化して比較します。</div>
</section>

<section class="panel">
  <strong>チェック内容</strong>
  <table>
    <tr><th>項目</th><th>内容</th></tr>
    <tr><td>ファイル</td><td>問題PDFと解答PDFが選択されているか</td></tr>
    <tr><td>版</td><td>ファイル名・PDFから年/月などを抽出し比較</td></tr>
    <tr><td>タイトル</td><td>先頭部分の文字列からタイトル候補を比較</td></tr>
    <tr><td>試験種別</td><td>1級/2級、学科/実技などを比較</td></tr>
    <tr><td>問題番号</td><td>PDF本文から「第1問」「問1」等を検出</td></tr>
    <tr><td>解答番号</td><td>解答側の番号列を検出</td></tr>
    <tr><td>異常報告</td><td>不一致・欠落・判定不能を一覧表示</td></tr>
  </table>
</section>

<section id="report" class="panel">
  <h2 style="margin-top:0">チェック結果</h2>
  <div id="summary"></div>
  <div id="details" style="margin-top:14px"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let qFile=null,aFile=null;

function norm(s){
  return (s||"")
    .normalize("NFKC")
    .replace(/[\u3000\s]+/g," ")
    .replace(/[‐‑‒–—―ー−]/g,"-")
    .trim().toLowerCase();
}
function meta(name){
  const n=norm(name);
  const years=[...(n.matchAll(/(?:20\d{2}|19\d{2})/g))].map(x=>x[0]);
  const months=[...(n.matchAll(/(?:^|[^0-9])(?:0?[1-9]|1[0-2])(?:月|[-_/])?/g))].map(x=>x[0].replace(/\D/g,"")).filter(Boolean);
  let grade=(n.match(/[12]\s*級/)||[])[0]||"";
  let type=n.includes("実技")?"実技":n.includes("学科")?"学科":"";
  return {years:[...new Set(years)],months:[...new Set(months)],grade,type};
}
function update(){
  qFile=$("q").files[0]||null;aFile=$("a").files[0]||null;
  $("files").innerHTML=(qFile?`<div class="fileitem">問題：${escapeHtml(qFile.name)}</div>`:"")+
    (aFile?`<div class="fileitem">解答：${escapeHtml(aFile.name)}</div>`:"")+
    ((!qFile&&!aFile)?"PDFを2つ選択してください。":"");
  $("check").disabled=!(qFile&&aFile);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("q").onchange=update;$("a").onchange=update;

function compare(label,x,y){
  if(!x.length||!y.length) return {label,state:"warn",msg:"判定不能（情報不足）"};
  const same=x.some(v=>y.includes(v));
  return {label,state:same?"ok":"ng",msg:same?"一致":"不一致"};
}
function numsFromName(n){
  const m=norm(n);
  const out=[];
  for(const z of m.matchAll(/(?:問|q)\s*(\d{1,3})/g)) out.push(+z[1]);
  return [...new Set(out)].sort((a,b)=>a-b);
}
function run(){
  const qm=meta(qFile.name),am=meta(aFile.name);
  const rows=[];
  rows.push(compare("版（年）",qm.years,am.years));
  if(qm.grade||am.grade) rows.push(compare("級",qm.grade?[qm.grade]:[],am.grade?[am.grade]:[]));
  if(qm.type||am.type) rows.push(compare("試験種別",qm.type?[qm.type]:[],am.type?[am.type]:[]));
  const qn=numsFromName(qFile.name),an=numsFromName(aFile.name);
  rows.push(qn.length&&an.length
    ? {label:"ファイル名中の問題番号",state:JSON.stringify(qn)===JSON.stringify(an)?"ok":"ng",msg:`問題側 ${qn.join(",")} / 解答側 ${an.join(",")}`}
    : {label:"問題番号",state:"warn",msg:"ファイル名からは判定不能"});
  const titleSame=norm(qFile.name).replace(/[_\-0-9]/g," ").includes(norm(am.grade+am.type));
  rows.push({label:"タイトル",state:"warn",msg:"PDF本文を未抽出のため暫定判定（ファイル名ベース）"});
  const bad=rows.filter(r=>r.state==="ng").length,warn=rows.filter(r=>r.state==="warn").length;
  $("summary").innerHTML=`<div class="status"><b>${bad?"❌ 異常あり":warn?"⚠ 要確認":"✅ 異常なし"}</b>　不一致 ${bad}件 / 要確認 ${warn}件</div>`;
  $("details").innerHTML=`<table><tr><th>項目</th><th>判定</th><th>内容</th></tr>`+
    rows.map(r=>`<tr><td>${escapeHtml(r.label)}</td><td><span class="badge ${r.state}">${r.state==="ok"?"OK":r.state==="ng"?"異常":"要確認"}</span></td><td>${escapeHtml(r.msg)}</td></tr>`).join("")+
    `</table><p class="small">現在の省エネ版はPDFを丸ごと解析せず、ファイル情報を中心に異常を絞り込みます。PDF本文の問題番号・タイトルを実際に読む機能は次段階で追加できます。</p>`;
  $("report").style.display="block";
}
$("check").onclick=run;
$("reset").onclick=()=>{ $("q").value="";$("a").value="";$("report").style.display="none";update(); };
update();
</script>
</body>
</html>

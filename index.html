<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>試験PDF判定エンジン（仕様準拠版）</title>
<style>
body { font-family: sans-serif; padding: 20px; }
pre { background: #f0f0f0; padding: 10px; }
</style>
</head>
<body>

<h2>試験PDF 判定（仕様準拠版）</h2>

<input type="file" id="pdf1">
<input type="file" id="pdf2">
<button id="run">判定する</button>

<pre id="out"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
async function extractText(file) {
    const data = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    let text = "";

    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(it => it.str).join(" ") + " ";
    }

    return text.replace(/\s+/g, " ");
}

function extractNumbers(text) {
    const reg = /A-\d+|B-\d+|問\d+/g;
    return text.match(reg) || [];
}

function isAnswerPDF(text) {
    // 仕様：答えPDFは「数字だけの行」が多い
    const lines = text.split(" ");
    let pureNumberLines = 0;

    for (const l of lines) {
        if (/^[1-5]$/.test(l)) pureNumberLines++;
    }

    return pureNumberLines >= 5; // 仕様：最低5行以上あれば答えPDFと判定
}

function judge(pdf1info, pdf2info) {

    const { nums1, nums2, isAns1, isAns2 } = pdf1info;

    // 仕様：問題×問題 → 採点不可
    if (!isAns1 && !isAns2) {
        return "採点不可：問題PDFどうしの組み合わせ";
    }

    // 仕様：答え×答え → 採点不可
    if (isAns1 && isAns2) {
        return "採点不可：答えPDFどうしの組み合わせ";
    }

    // 仕様：問題×答えの組み合わせのみ採点可能
    const problemNums = !isAns1 ? nums1 : nums2;
    const answerNums  =  isAns1 ? nums1 : nums2;

    // 番号一致チェック（仕様）
    if (problemNums.length !== answerNums.length) {
        return "採点不可：問題番号と答え番号の数が一致しない";
    }

    for (let i = 0; i < problemNums.length; i++) {
        if (problemNums[i] !== answerNums[i]) {
            return "採点不可：問題番号と答え番号が一致しない";
        }
    }

    return "採点可能：問題PDFと答えPDFの組み合わせが正しい";
}

document.getElementById("run").onclick = async () => {
    const f1 = document.getElementById("pdf1").files[0];
    const f2 = document.getElementById("pdf2").files[0];

    if (!f1 || !f2) {
        document.getElementById("out").textContent = "PDFを2つ選択してください";
        return;
    }

    const t1 = await extractText(f1);
    const t2 = await extractText(f2);

    const nums1 = extractNumbers(t1);
    const nums2 = extractNumbers(t2);

    const info = {
        nums1,
        nums2,
        isAns1: isAnswerPDF(t1),
        isAns2: isAnswerPDF(t2)
    };

    const result = judge(info, info);
    document.getElementById("out").textContent =
        `PDF1: ${f1.name}\nPDF2: ${f2.name}\n\n` +
        `問題番号(PDF1): ${nums1.join(", ")}\n` +
        `問題番号(PDF2): ${nums2.join(", ")}\n\n` +
        `PDF1は答えPDFか？: ${info.isAns1}\n` +
        `PDF2は答えPDFか？: ${info.isAns2}\n\n` +
        `判定結果: ${result}`;
};
</script>

</body>
</html>
